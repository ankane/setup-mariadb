name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            mariadb-version: 12.3
          - os: ubuntu-26.04
            mariadb-version: 11.8

          - os: ubuntu-26.04-arm
            mariadb-version: 12.3
          - os: ubuntu-26.04-arm
            mariadb-version: 11.8

          - os: ubuntu-24.04
            mariadb-version: 12.3
          - os: ubuntu-24.04
            mariadb-version: 11.8
          - os: ubuntu-24.04
            mariadb-version: 11.4
          - os: ubuntu-24.04
            mariadb-version: 10.11

          - os: ubuntu-24.04-arm
            mariadb-version: 12.3
          - os: ubuntu-24.04-arm
            mariadb-version: 11.8
          - os: ubuntu-24.04-arm
            mariadb-version: 11.4
          - os: ubuntu-24.04-arm
            mariadb-version: 10.11

          - os: ubuntu-22.04
            mariadb-version: 12.3
          - os: ubuntu-22.04
            mariadb-version: 11.8
          - os: ubuntu-22.04
            mariadb-version: 11.4
          - os: ubuntu-22.04
            mariadb-version: 10.11

          - os: ubuntu-22.04-arm
            mariadb-version: 12.3
          - os: ubuntu-22.04-arm
            mariadb-version: 11.8
          - os: ubuntu-22.04-arm
            mariadb-version: 11.4
          - os: ubuntu-22.04-arm
            mariadb-version: 10.11

          - os: macos-26
            mariadb-version: 12.3
          - os: macos-26
            mariadb-version: 11.8
          - os: macos-26
            mariadb-version: 11.4
          - os: macos-26
            mariadb-version: 10.11

          - os: macos-15
            mariadb-version: 12.3
          - os: macos-15
            mariadb-version: 11.8
          - os: macos-15
            mariadb-version: 11.4
          - os: macos-15
            mariadb-version: 10.11

          - os: macos-15-intel
            mariadb-version: 12.3
          - os: macos-15-intel
            mariadb-version: 11.8
          - os: macos-15-intel
            mariadb-version: 11.4
          - os: macos-15-intel
            mariadb-version: 10.11

          - os: windows-2025
            mariadb-version: 12.3
          - os: windows-2025
            mariadb-version: 11.8
          - os: windows-2025
            mariadb-version: 11.4
          - os: windows-2025
            mariadb-version: 10.11

          - os: windows-2022
            mariadb-version: 12.3
          - os: windows-2022
            mariadb-version: 11.8
          - os: windows-2022
            mariadb-version: 11.4
          - os: windows-2022
            mariadb-version: 10.11
    steps:
      - uses: actions/checkout@v7
      - uses: ./.
        with:
          mariadb-version: ${{ matrix.mariadb-version }}
          database: testdb
          user: ${{ matrix.mariadb-version == 11.4 && 'testuser' || '' }}
      - run: mariadb --version
      - run: mariadb -e 'SELECT VERSION()' ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - run: mariadb -e 'SELECT CURRENT_USER()' ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - run: mariadb -e 'SELECT DATABASE()' ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - run: mariadb -e "SHOW VARIABLES LIKE 'socket'" ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - run: mariadbadmin create testdb2 ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - run: mariadb -D testdb -e 'SELECT DATABASE()' ${{ matrix.mariadb-version == 11.4 && '-u testuser' || '' }}
      - if: ${{ runner.os != 'Windows' }}
        run: mariadb-tzinfo-to-sql /usr/share/zoneinfo | mariadb -u root mysql
